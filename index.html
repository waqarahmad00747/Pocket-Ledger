<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PocketLedger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PocketLedger</title>
<style>
:root{color-scheme:light;
--bg:#f3f4fb;--card:#ffffff;--text:#1f2340;--muted:#565b7e;--line:#dfe2f1;--soft:#f5f6fc;
--primary:#4f46e5;--income:#10b981;--expense:#ef4444;--lend:#f59e0b;--borrow:#8b5cf6;
--pos:#047857;--neg:#c81e1e;--lendtxt:#92400e;--bortxt:#6d28d9;
--btn-primary:linear-gradient(120deg,#4f46e5,#7c3aed);--on-primary:#fff;
--btn-green:linear-gradient(120deg,#047857,#065f46);--on-green:#fff;
--btn-danger:#dc2626;--on-danger:#fff;
--head-grad:linear-gradient(120deg,#4338ca 0%,#6d28d9 50%,#0f766e 100%);--head-text:#fff;
--logo-bg:rgba(255,255,255,.2);--pill-bg:rgba(0,0,0,.3);--pill-text:#fff;--ghost-bg:rgba(0,0,0,.3);--ghost-text:#fff;--ghost-border:transparent;
--th-bg:#f5f6fc;--th-fg:#565b7e;--note-bg:rgba(99,102,241,.1);--track:#8a8fb8;--focus:#4f46e5;
--toast-bg:#1f2340;--toast-fg:#fff;--btn-border:#dfe2f1;--input-border:#dfe2f1;--card-bw:0px;--card-border:transparent;
--shadow:0 6px 24px rgba(40,50,120,.08);--radius:16px}
[data-theme=dark]{color-scheme:dark;
--bg:#0c0e20;--card:#161a33;--text:#eef0ff;--muted:#aeb4da;--line:#2c3260;--soft:#1d2244;
--pos:#34d399;--neg:#ff8097;--lendtxt:#fbbf24;--bortxt:#c4b5fd;
--head-grad:linear-gradient(120deg,#312e81 0%,#5b21b6 55%,#0f766e 100%);
--th-bg:#1d2244;--th-fg:#aeb4da;--note-bg:rgba(129,140,248,.18);--focus:#a5b4fc;
--toast-bg:#eef0ff;--toast-fg:#0c0e20;--btn-border:#3a4178;--input-border:#3a4178;
--shadow:0 6px 24px rgba(0,0,0,.45)}
[data-theme=contrast]{color-scheme:dark;
--bg:#000;--card:#0a0a14;--text:#ffffff;--muted:#d9deff;--line:#4a4f7a;--soft:#15152b;
--income:#00ff9d;--expense:#ff4d6d;--lend:#ffd60a;--borrow:#d16bff;--primary:#ffe600;
--pos:#00ff9d;--neg:#ff6b86;--lendtxt:#ffd60a;--bortxt:#e3b8ff;
--btn-primary:#ffe600;--on-primary:#000;--btn-green:#00ff9d;--on-green:#000;--btn-danger:#ff3b6b;--on-danger:#000;
--head-grad:linear-gradient(110deg,#ff2d95 0%,#ff8a00 55%,#ffe600 100%);--head-text:#000;
--logo-bg:#000;--pill-bg:#000;--pill-text:#fff;--ghost-bg:#000;--ghost-text:#ffe600;--ghost-border:#000;
--th-bg:#ffe600;--th-fg:#000;--note-bg:#1b1b3a;--track:#7a7fb0;--focus:#00e5ff;
--toast-bg:#ffe600;--toast-fg:#000;--btn-border:#ffffff;--input-border:#9aa0ff;--card-bw:2px;--card-border:#00e5ff;
--shadow:0 0 0 1px #000,0 8px 28px rgba(0,229,255,.18)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
h1,h2,h3{margin:0}
h2{font-size:18px}
h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:4px 0 10px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{background:var(--head-grad);color:var(--head-text);padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--logo-bg);color:#fff;display:grid;place-items:center;font-size:24px}
.brand h1{font-size:24px;letter-spacing:.2px}
.brand small{font-size:13px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{background:var(--pill-bg);color:var(--pill-text);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}
.pill.warn{background:#fde68a;color:#451a03}
.tabs{display:flex;gap:6px;padding:10px 20px;overflow-x:auto;background:var(--card);box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 16px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.tabs button:hover{background:var(--soft);color:var(--text)}
.tabs button.active{background:var(--btn-primary);color:var(--on-primary);box-shadow:0 4px 12px rgba(99,102,241,.4)}
main{max-width:1200px;margin:0 auto;padding:22px 18px 60px}
.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;min-width:0;border:var(--card-bw) solid var(--card-border)}
.grid{display:grid;gap:18px}
.grid.two{grid-template-columns:minmax(280px,360px) 1fr;align-items:start}
.grid.even{grid-template-columns:1fr 1fr}
.grid>*,.stack>*{min-width:0}
.stack{min-width:0}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(225px,1fr));margin-bottom:18px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;gap:14px;align-items:center;border-left:5px solid var(--c,#6366f1)}
.stat .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c,#6366f1) 18%,transparent)}
.stat span{display:block;color:var(--muted);font-size:13px}
.stat b{font-size:20px;white-space:nowrap;display:block}
.stat>div:last-child{min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat.bal{--c:#6366f1}.stat.inc{--c:var(--income)}.stat.exp{--c:var(--expense)}.stat.len{--c:var(--lend)}.stat.bor{--c:var(--borrow)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
input,select,textarea{width:100%;margin-top:5px;padding:10px 12px;border:1.5px solid var(--input-border);border-radius:10px;background:var(--soft);color:var(--text);font:inherit;outline:none;transition:.15s}
input::placeholder{color:var(--muted);opacity:.85}
select option{background:var(--card);color:var(--text)}
input:focus,select:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 30%,transparent)}
.btn{border:1.5px solid var(--btn-border);border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--soft);color:var(--text);transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.btn.primary{background:var(--btn-primary);color:var(--on-primary);border-color:transparent}
.btn.green{background:var(--btn-green);color:var(--on-green);border-color:transparent}
.btn.danger{background:var(--btn-danger);color:var(--on-danger);border-color:transparent}
.btn.ghost{background:var(--ghost-bg);color:var(--ghost-text);border-color:var(--ghost-border)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px}
.chip button{border:0;background:transparent;color:var(--neg);cursor:pointer;font-size:16px;font-weight:700;line-height:1;padding:2px 6px;border-radius:50%}
.chip button:hover{background:color-mix(in srgb,var(--neg) 20%,transparent)}
form.inline{display:flex;gap:8px}
form.inline input{margin:0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{margin:0;width:auto;padding:7px 10px}
.total{color:var(--muted);margin-bottom:10px;font-size:14px}
.total b{color:var(--text);font-size:16px}
.table-wrap{overflow-x:auto;max-height:520px;overflow-y:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:var(--th-bg);color:var(--th-fg);text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;z-index:1}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--soft)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.table-wrap td:first-child{white-space:nowrap}
td.act{white-space:nowrap;text-align:right}
.empty{color:var(--muted);text-align:center;padding:26px!important}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--line);color:var(--text)}
.tag.Income,.tag.ok{color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,var(--card));border-color:transparent}
.tag.Expense{color:var(--neg);background:color-mix(in srgb,var(--neg) 14%,var(--card));border-color:transparent}
.tag.Lend{color:var(--lendtxt);background:color-mix(in srgb,var(--lend) 18%,var(--card));border-color:transparent}
.tag.Borrow{color:var(--bortxt);background:color-mix(in srgb,var(--borrow) 16%,var(--card));border-color:transparent}
.tag.warnt{color:var(--lendtxt);background:color-mix(in srgb,var(--lend) 18%,var(--card));border-color:transparent}
.tag.errt{color:var(--neg);background:color-mix(in srgb,var(--neg) 14%,var(--card));border-color:transparent}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.sec-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-title:first-child{margin-top:0}
.sec-title small{color:var(--muted)}
.bars .row{margin-bottom:12px}
.bars .row div.l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bars .track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bars .fill{height:100%;border-radius:99px}
.recent li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.recent{list-style:none;margin:0;padding:0}
.recent small{color:var(--muted);display:block}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chart-card canvas{width:100%;height:340px;display:block}
.chart-card.pie canvas{height:300px}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;background:rgba(20,22,45,.95);color:#fff;padding:7px 11px;border-radius:9px;font-size:12.5px;white-space:nowrap;z-index:5;display:none;box-shadow:0 6px 18px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.25)}
.legend{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.legend li{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .ln{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend em{color:var(--muted);font-style:normal;width:52px;text-align:right}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block}
.lg-inline{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.lg-inline span{display:flex;align-items:center;gap:6px}
.switch{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--text);cursor:pointer}
.switch input{width:46px;height:26px;flex:none;appearance:none;-webkit-appearance:none;background:var(--track);border-radius:99px;position:relative;cursor:pointer;margin:0;border:0;transition:.2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.switch input:checked{background:var(--income)}
.switch input:checked::after{left:23px}
.muted{color:var(--muted)}
.note{background:var(--note-bg);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--text);border:1px solid var(--line)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.info-grid div{background:var(--soft);border-radius:12px;padding:10px 12px}
.info-grid b{display:block;font-size:20px}
.info-grid span{font-size:12px;color:var(--muted)}
dialog{border:0;border-radius:18px;padding:24px;width:min(420px,92vw);background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(5,6,18,.65);backdrop-filter:blur(3px)}
dialog h2{margin-bottom:14px}
dialog .actions{justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--toast-bg);color:var(--toast-fg);padding:11px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.print-head{display:none}
.rsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.rsum div{background:var(--soft);border-radius:12px;padding:10px 14px}
.rsum span{font-size:12px;color:var(--muted);display:block}
.rsum b{font-size:18px}

.fld{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
.seg{display:flex;gap:8px;margin-top:5px}
.seg button{flex:1;border:1.5px solid var(--btn-border);background:var(--soft);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
.seg button.on.add,.seg button.on.profit{background:var(--btn-green);color:var(--on-green);border-color:transparent}
.seg button.on.sub,.seg button.on.loss{background:var(--btn-danger);color:var(--on-danger);border-color:transparent}
.fsb{border-radius:12px;padding:14px 16px;margin:0 0 14px;border:1px solid var(--line);border-left-width:8px;background:var(--note-bg);color:var(--text);line-height:1.6}
.fsb.ok{border-left-color:var(--income);background:color-mix(in srgb,var(--pos) 13%,var(--card))}
.fsb.none{border-left-color:var(--lend)}
.fsb.warn{border-left-color:var(--lend);background:color-mix(in srgb,var(--lend) 14%,var(--card))}
.fsb.err{border-left-color:var(--expense);background:color-mix(in srgb,var(--neg) 12%,var(--card))}
.fsb .big{font-size:17px}
.pv{background:var(--note-bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 12px;color:var(--text)}
.sub-total td{font-weight:700;background:var(--soft)}
.stat.grand{--c:#6366f1}
[data-theme=contrast] .stat.grand{--c:#ffe600}
/* ---- Neon Contrast extras ---- */
[data-theme=contrast] .tabs{border-bottom:3px solid #ffe600;box-shadow:none}
[data-theme=contrast] .tabs button{color:#fff}
[data-theme=contrast] .tabs button:hover{background:#262650;color:#ffe600}
[data-theme=contrast] .tabs button.active{color:#000;box-shadow:0 0 0 2px #000,0 0 0 4px #ffe600}
[data-theme=contrast] .tabs button.active:hover{background:#ffe600;color:#000}
[data-theme=contrast] .stat{border:2px solid var(--c);border-left-width:10px}
[data-theme=contrast] .stat.bal{--c:#00e5ff}
[data-theme=contrast] .stat.inc{--c:#00ff9d}
[data-theme=contrast] .stat.exp{--c:#ff4d6d}
[data-theme=contrast] .stat.len{--c:#ffd60a}
[data-theme=contrast] .stat.bor{--c:#d16bff}
[data-theme=contrast] .stat b{font-size:21px}
[data-theme=contrast] dialog{border:3px solid #ffe600}
[data-theme=contrast] .btn:hover{box-shadow:0 0 0 3px #00e5ff;transform:none}
[data-theme=contrast] .btn.primary:hover,[data-theme=contrast] .btn.green:hover{box-shadow:0 0 0 3px #fff}
[data-theme=contrast] .brand h1{text-shadow:none;font-weight:800}
[data-theme=contrast] .tag{border:1px solid currentColor}
[data-theme=contrast] .table-wrap{border:2px solid #4a4f7a}
[data-theme=contrast] h3{color:#00e5ff}
[data-theme=contrast] .pill{border:2px solid #ffe600}
[data-theme=contrast] .tip{background:#ffe600;color:#000;border-color:#000}
[data-theme=contrast] .chip{border-color:#9aa0ff}
/* ===== Financial cycles ===== */
[hidden]{display:none!important}
.cydash{margin-bottom:18px}.cydash .grid.stats{margin-bottom:0}
.cytag{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.cytag.none{color:var(--neg);font-weight:700}
.cyhint{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.cyhint b.neg{color:var(--neg)}
tr.sel td{background:color-mix(in srgb,var(--primary) 12%,var(--card))}
.daily{display:flex;align-items:flex-end;gap:2px;height:130px;padding:8px;background:var(--soft);border-radius:14px;margin-top:10px}
.daily i{flex:1;min-width:2px;background:linear-gradient(var(--primary),var(--borrow));border-radius:3px 3px 0 0}
.daily-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.trend{display:flex;gap:14px;overflow-x:auto;align-items:flex-end;padding:10px 2px}
.trend .tc{flex:0 0 96px;text-align:center}
.trend .tb{height:140px;display:flex;align-items:flex-end;justify-content:center;gap:4px;border-bottom:1px solid var(--line)}
.trend .tb i{width:26px;min-height:2px;border-radius:6px 6px 0 0}
.trend .ti,.lg.i{background:var(--pos)}.trend .te,.lg.e{background:var(--neg)}
.trend .tc b{display:block;font-size:13px;margin-top:6px}
.trend .tc small{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px}
details summary{cursor:pointer;color:var(--primary-text,var(--text));font-weight:700}
/* ===== long-text safety ===== */
.recent li>*,.list-head>*,.info-grid>*,.bars .l>*,.fsb,.note,.card>*{min-width:0}
.recent li div,.recent li small,.recent li b,.bars .l span,.chip,.info-grid span,.list-head h2,.list-head h3,.card h2,.card h3,.card p,.note,.fsb,td:not(.num),.sec-title *,label{overflow-wrap:anywhere}
.list-head{flex-wrap:wrap}
select,input{max-width:100%}
/* ===== Modern look layer ===== */
body{font-family:"Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;letter-spacing:.005em}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 8% -5%,color-mix(in srgb,var(--primary) 14%,transparent),transparent 60%),radial-gradient(800px 500px at 100% 0%,color-mix(in srgb,var(--borrow) 13%,transparent),transparent 60%)}
[data-theme=contrast] body::before{display:none}
.top{position:relative;overflow:hidden;padding:26px 32px 30px;border-radius:0 0 28px 28px;box-shadow:0 14px 40px rgba(60,40,160,.28)}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.top::before{width:320px;height:320px;right:-80px;top:-160px;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.top::after{width:260px;height:260px;left:32%;bottom:-170px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%)}
[data-theme=contrast] .top::before,[data-theme=contrast] .top::after{display:none}
.top>*{position:relative;z-index:1}
.logo{width:54px;height:54px;border-radius:18px;font-size:27px;box-shadow:0 8px 20px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4);backdrop-filter:blur(6px);animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-3px) rotate(-3deg)}}
.brand h1{font-size:28px;font-weight:800;letter-spacing:-.4px}
.pill{backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tabs{margin:-16px auto 0;max-width:1180px;width:calc(100% - 24px);border-radius:20px;padding:8px;gap:4px;top:10px;box-shadow:0 12px 34px rgba(40,50,120,.18);border:1px solid var(--line);background:var(--card)}
.tabs button{padding:11px 18px;border-radius:14px;font-weight:700;transition:transform .15s,background .15s,box-shadow .15s}
.tabs button:hover{transform:translateY(-1px)}
.tabs button.active{box-shadow:0 8px 20px rgba(99,102,241,.45);transform:translateY(-1px)}
main{padding-top:30px}

<body>

<header class="top">
  <div class="brand">
    <div class="logo">💼</div>
    <div><h1 id="appNameHead">PocketLedger</h1><small>My Daily Money Companion</small></div>
  </div>
  <div class="top-right">
    <span id="saveStatus" class="pill">Autosave on</span>
    <button class="btn ghost" id="btnTheme" title="Switch theme">🎨 Theme</button>
    <button class="btn ghost" id="btnSettings">⚙ Settings</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <section class="panel" id="tab-dashboard"></section>
  <section class="panel" id="tab-income"></section>
  <section class="panel" id="tab-expense"></section>
  <section class="panel" id="tab-lb"></section>
  <section class="panel" id="tab-cycles"></section>
  <section class="panel" id="tab-charts"></section>
  <section class="panel" id="tab-reports"></section>
  <section class="panel" id="tab-backup"></section>
  <section class="panel" id="tab-nbp"></section>
</main>

<dialog id="settingsDlg">
  <h2>⚙ Settings</h2>
  <label>App name<input id="setName" maxlength="30"></label>
  <label>Currency symbol<input id="setCur" maxlength="6" placeholder="e.g. Rs, $, €"></label>
  <label>Theme<select id="setTheme"><option value="light">Light</option><option value="dark">Dark</option><option value="contrast">Neon Contrast</option></select></label>
  <div class="actions"><button class="btn" id="setCancel" type="button">Cancel</button><button class="btn primary" id="setSave" type="button">Save settings</button></div>
</dialog>

<dialog id="confirmDlg">
  <h2 id="confirmTitle">Please confirm</h2>
  <p id="confirmMsg" class="muted"></p>
  <div class="actions"><button class="btn" id="confirmNo" type="button">Cancel</button><button class="btn danger" id="confirmOk" type="button">Delete</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const KEY='pocketledger_data_v1';
const MAXAMT=999999999999;
const NBP_DEF_CATS=['Deposit','Withdrawal','Investment','Bank charges','Transfer','Zakat','Other'];
const parseAmt=v=>Math.round(parseFloat(v)*100)/100;
const PALETTE=['#6366f1','#14b8a6','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#0ea5e9'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
const fmtDate=s=>{const p=String(s||'').split('-');return p.length===3?(+p[2])+' '+MON[+p[1]-1]+' '+p[0]:s};
const byDateDesc=(a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1);
/* ---------- financial cycles: date helpers ---------- */
function isoToUTC(s){const p=String(s).split('-'),d=new Date(0);d.setUTCFullYear(+p[0],+p[1]-1,+p[2]);return d.getTime();}
function utcToIso(t){const d=new Date(t);return String(d.getUTCFullYear()).padStart(4,'0')+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
function validIso(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s))&&utcToIso(isoToUTC(s))===s;}
function addDays(s,n){return utcToIso(isoToUTC(s)+n*864e5);}
function diffDays(a,b){return Math.round((isoToUTC(b)-isoToUTC(a))/864e5);}

let S,dirty=false,lastSaved=null,saveErr=false,current='dashboard';

function money(n){
  const s=String(S.settings.currency||'').replace(/[<>&"'`]/g,'').slice(0,6);
  const v=Math.abs(+n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
  return (n<0?'-':'')+s+(/[A-Za-z]$/.test(s)?' ':'')+v;
}
function fmtC(n){return n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,'')+'k':String(Math.round(n))}

/* ---------- data ---------- */
function defaults(){return{
  settings:{appName:'PocketLedger',currency:'Rs',theme:'light',autosave:true,taxRate:15},
  incomeCats:['Salary','Dividend','Business','Freelance','Gift','Other'],
  expenseCats:['Food & Groceries','Rent','Utilities','Transport','Health','Education','Shopping','Entertainment','Other'],
  nbpCats:NBP_DEF_CATS.slice(),nbp:[],nbpPL:[],cycles:[],
  income:[],expense:[],lend:[],borrow:[]};}
function clampRate(v){if(v===null||v===undefined||v==='')return 15;const n=Number(v);if(!Number.isFinite(n))return 15;return Math.min(100,Math.max(0,Math.round(n*100)/100));}
function normalize(o){
  const base=defaults();const r=Object.assign({},base,o||{});
  r.settings=Object.assign(base.settings,(o&&o.settings)||{});
  ['incomeCats','expenseCats','income','expense','lend','borrow'].forEach(k=>{if(!Array.isArray(r[k]))r[k]=defaults()[k]});
  const okDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d)?d:todayStr();
  ['income','expense','lend','borrow'].forEach(k=>{r[k]=r[k].filter(x=>x&&typeof x==='object'&&!Array.isArray(x)).map(x=>{const a=Math.abs(Number(x.amount));const o=Object.assign({},x,{id:String(x.id||uid()),date:okDate(String(x.date||'').slice(0,10)),amount:Number.isFinite(a)?Math.min(a,MAXAMT):0,note:String(x.note==null?'':x.note)});
    if(k==='income'||k==='expense')o.cat=String(x.cat==null?'':x.cat);else{o.person=String(x.person==null?'':x.person);o.settled=!!x.settled;}return o;})});
  if(!['light','dark','contrast'].includes(r.settings.theme))r.settings.theme='light';
  r.settings.appName=String(r.settings.appName||'PocketLedger').slice(0,30);r.settings.currency=String(r.settings.currency==null?'Rs':r.settings.currency).replace(/[<>&"'`]/g,'').slice(0,6);
  r.incomeCats=r.incomeCats.map(String);r.expenseCats=r.expenseCats.map(String);
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  const amt=v=>{const a=Math.abs(Number(v));return Number.isFinite(a)?Math.min(Math.round(a*100)/100,MAXAMT):0;};
  r.nbpCats=(Array.isArray(r.nbpCats)?r.nbpCats:NBP_DEF_CATS.slice()).map(String);
  r.nbp=(Array.isArray(r.nbp)?r.nbp:[]).filter(isObj).map(x=>({id:String(x.id||uid()),date:okDate(String(x.date||'').slice(0,10)),type:x.type==='sub'?'sub':'add',cat:String(x.cat==null?'':x.cat),amount:amt(x.amount),note:String(x.note==null?'':x.note)}));
  r.nbpPL=(Array.isArray(r.nbpPL)?r.nbpPL:[]).filter(isObj).map(x=>({id:String(x.id||uid()),date:okDate(String(x.date||'').slice(0,10)),kind:x.kind==='loss'?'loss':'profit',amount:amt(x.amount),rate:clampRate(x.rate),note:String(x.note==null?'':x.note)}));
  r.settings.taxRate=clampRate(r.settings.taxRate);
  const seenStart=new Set();
  r.cycles=(Array.isArray(r.cycles)?r.cycles:[]).filter(isObj).map(x=>({id:String(x.id||uid()),name:String(x.name==null?'':x.name).slice(0,40)||'Cycle',start:String(x.start==null?'':x.start).slice(0,10),desc:String(x.desc==null?'':x.desc).slice(0,200)})).filter(x=>validIso(x.start)&&!seenStart.has(x.start)&&seenStart.add(x.start));
  return r;
}
function load(){try{const raw=localStorage.getItem(KEY);S=raw?normalize(JSON.parse(raw)):defaults();}catch(e){S=defaults();}}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));lastSaved=new Date();dirty=false;saveErr=false;}
  catch(e){saveErr=true;}
  updateStatus();scheduleFolderWrite();try{scheduleSnapshot();}catch(e){}
}
function commit(){
  if(S.settings.autosave)save();else{dirty=true;updateStatus();}
  renderAll();
}
function updateStatus(){
  const el=$('saveStatus');let t,warn=false;
  if(saveErr){t='⚠ Browser storage unavailable';warn=true;}
  else if(dirty){t='● Unsaved changes';warn=true;}
  else if(lastSaved){t='✔ Saved '+pad(lastSaved.getHours())+':'+pad(lastSaved.getMinutes())+':'+pad(lastSaved.getSeconds());}
  else t=S.settings.autosave?'✔ Autosave on':'Autosave off';
  if(!saveErr&&FS.h){if(FS.state==='ok')t+=' · 📁 '+String(FS.h.name).slice(0,18)+' synced';else if(FS.state==='needperm'){t='📁 Reconnect backup folder';warn=true;}else if(FS.state==='error'){t+=' · 📁 folder error';warn=true;}}
  el.textContent=t;el.classList.toggle('warn',warn);
  const b=$('bkStatus');if(b)b.textContent=t;
}

/* ---------- autosave to folder (File System Access API) ---------- */
const FS={h:null,mode:'dir',state:'none',msg:'',tech:'',err:'',last:null,size:0,persist:true,reconnecting:false,autoAsked:false,lastDl:null};
let fsTimer=null,fsBusy=false,fsAgain=false,dlTimer=null,reconnectArmed=false;
const FS_NAME='PocketLedger-autosave.json';
const UA=navigator.userAgent||'';
const IS_MOBILE=/Android|iPhone|iPad|iPod|Mobile/i.test(UA);
const HAS_DIR=()=>'showDirectoryPicker' in window,HAS_FILE=()=>'showSaveFilePicker' in window;
const hms=d=>pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
function browserName(){if(/Electron\//.test(UA))return'This app window';if(/Edg\//.test(UA))return'Edge';if(/OPR\//.test(UA))return'Opera';if(/Firefox\//.test(UA))return'Firefox';if(/Chrome\/|CriOS/.test(UA))return'Chrome';if(/Safari\//.test(UA))return'Safari';return'This browser';}
function fsBlock(){
  if(!HAS_DIR()&&!HAS_FILE())return IS_MOBILE?'mobile':'unsupported';
  try{if(window.self!==window.top)return 'frame';}catch(e){return 'frame';}
  if(!window.isSecureContext)return 'insecure';
  return '';
}
const FS_FIX={
  unsupported:'Open this file in Chrome, Edge or Opera on a computer. Until then, the Save button downloads a backup file and the auto-download option below saves to your Downloads folder.',
  mobile:'Use a Windows, Mac or Linux computer with Chrome or Edge for folder autosave. On this device, the Save button downloads a backup file and the auto-download option below saves to your Downloads folder.',
  frame:'Save the file to your computer, then open it directly in Chrome or Edge (double-click it, or right-click ▸ Open with ▸ Chrome).',
  insecure:'Open the file from your computer (file://) or from an https:// address.'};
function fsWhy(k){return({unsupported:browserName()+' cannot write to a folder you choose (only Chrome, Edge and Opera on a computer can).',mobile:'Phones and tablets do not let a web page write into a folder.',frame:'This page is open inside a preview frame, where the browser blocks folder access.',insecure:'The browser only allows folder access on secure pages.'})[k];}
function blockText(kind,block){
  if(block)return fsWhy(block)+' '+FS_FIX[block];
  if(kind==='dir'&&!HAS_DIR())return browserName()+' cannot select a whole folder.'+(HAS_FILE()?' Use “Select a backup file instead” below.':'');
  return browserName()+' cannot select a backup file.';
}
function techOf(e){return (e&&e.name||'Error')+(e&&e.message?': '+e.message:'');}
function fsExplain(e,kind){
  const n=e&&e.name,m=(e&&e.message)||'';
  if(n==='SecurityError')return 'The browser blocked that '+(kind==='file'?'location':'folder')+'. Chrome does not allow Desktop, Documents, Downloads or a drive root (C:, D:) itself as a folder — create a NEW folder (for example “PocketLedger Backups”) and select that, or use “Select a backup file instead”.';
  if(n==='NotAllowedError')return 'Permission was denied. Select again and click “Edit files” / “Save changes” when the browser asks.';
  if(n==='NotFoundError')return 'The folder or file was not found (it may have been moved or deleted). Select it again.';
  if(n==='NoModificationAllowedError'||n==='InvalidStateError')return 'The backup file is locked or in use by another program.';
  if(n==='QuotaExceededError')return 'The disk is full.';
  return m||n||'Unknown error';
}
function idb(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB unavailable'));const r=indexedDB.open('pocketledger_fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite'),st=t.objectStore('kv');v===null?st.delete(k):st.put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function putFile(name,text){const fh=await FS.h.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(text);await w.close();return (await fh.getFile()).size;}
const idleFS=async()=>{for(let i=0;i<100&&fsBusy;i++)await new Promise(r=>setTimeout(r,30));};
async function writeFolder(){
  if(!FS.h)return false;
  if(fsBusy){fsAgain=true;return FS.state==='ok';}
  fsBusy=true;
  try{
    const perm=await FS.h.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){FS.state='needperm';armReconnect();}
    else{
      const json=JSON.stringify(S,null,2);
      if(FS.mode==='file'){const w=await FS.h.createWritable();await w.write(json);await w.close();FS.size=(await FS.h.getFile()).size;}
      else{FS.size=await putFile(FS_NAME,json);if(S.settings.keepDated)await putFile('PocketLedger-backup-'+todayStr()+'.json',json);}
      FS.state='ok';FS.last=new Date();FS.msg='';FS.tech='';
    }
  }catch(e){FS.state='error';FS.msg=fsExplain(e,FS.mode);FS.tech=techOf(e);}

function cyStats(c){
  const inR=d=>d>=c.start&&(!c.end||d<=c.end);
  const inc=S.income.filter(x=>inR(x.date)),exp=S.expense.filter(x=>inR(x.date));
  const I=r2(sum(inc)),E=r2(sum(exp)),net=r2(I-E),ec={},ic={},daily={};
  exp.forEach(x=>{ec[x.cat]=r2((ec[x.cat]||0)+x.amount);daily[x.date]=r2((daily[x.date]||0)+x.amount);});
  inc.forEach(x=>{ic[x.cat]=r2((ic[x.cat]||0)+x.amount);});
  const t=todayStr();let last=null;
  if(c.start<=t)last=(c.end&&c.end<t)?c.end:t;
  const days=last?diffDays(c.start,last)+1:0;
  let hi=null;Object.keys(daily).forEach(d=>{if(!hi||daily[d]>hi.v)hi={d:d,v:daily[d]};});
  let end=c.end||t;const mx=Object.keys(daily).sort().pop();if(!c.end&&mx&&mx>end)end=mx;
  const list=[];if(c.start<=end){const n=Math.min(diffDays(c.start,end)+1,400);for(let i=0;i<n;i++){const d=addDays(c.start,i);list.push({d:d,v:daily[d]||0});}}

}

function renderCyCompare(all){
  const el=$('cyCompare');
  if(all.length<2){el.innerHTML='<h2>⚖️ Compare cycles</h2><p class="muted" style="margin-top:8px">Create at least two cycles to compare spending, categories and savings.</p>';return;}
  if(!all.some(c=>c.id===CY.b))CY.b=all[all.length-1].id;
  if(!all.some(c=>c.id===CY.a)||CY.a===CY.b){const i=all.findIndex(c=>c.id===CY.b);CY.a=(all[i-1]||all[i+1]||all[0]).id;}
  const A=all.find(c=>c.id===CY.a),B=all.find(c=>c.id===CY.b),sa=cyStats(A),sb=cyStats(B);
  const opts=v=>all.slice().reverse().map(x=>`<option value="${x.id}"${x.id===v?' selected':''}>${esc(cyLabel(x))}</option>`).join('');
  const pct=(a,b)=>a===0?(b===0?'—':'new'):(Math.round((b-a)/a*1000)/10+'%');
  const row=(l,a,b,bad,f)=>{const d=r2(b-a),fm=f||money;return `<tr><td>${l}</td><td class="num">${fm(a)}</td><td class="num">${fm(b)}</td><td class="num"><b class="${d===0?'':((d>0)===!!bad?'neg':'pos')}">${d>0?'+':''}${fm(d)}</b></td><td class="num">${pct(a,b)}</td></tr>`;};
  const cats=[...new Set(Object.keys(sa.ec).concat(Object.keys(sb.ec)))].sort((x,y)=>Math.max(sb.ec[y]||0,sa.ec[y]||0)-Math.max(sb.ec[x]||0,sa.ec[x]||0));
  const trend=all.slice(-12).map(c=>({c:c,s:cyStats(c)})),tm=Math.max.apply(null,trend.map(x=>Math.max(x.s.I,x.s.E,1)));
  el.innerHTML=`<div class="list-head"><h2>⚖️ Compare cycles</h2>
    <div class="filters"><label style="margin:0">A<select id="cyA">${opts(CY.a)}</select></label><label style="margin:0">B<select id="cyB">${opts(CY.b)}</select></label></div></div>
    <div class="table-wrap"><table><thead><tr><th>Measure</th><th class="num">${esc(A.name)}</th><th class="num">${esc(B.name)}</th><th class="num">Change (B − A)</th><th class="num">%</th></tr></thead><tbody>
      ${row('Income',sa.I,sb.I,false)}${row('Expenses',sa.E,sb.E,true)}${row('Savings',Math.max(0,sa.net),Math.max(0,sb.net),false)}${row('Avg spend / day',sa.avg,sb.avg,true)}
    </tbody></table></div>
    <h3 style="margin-top:18px">Category-wise spending</h3>
    <div class="table-wrap"><table><thead><tr><th>Category</th><th class="num">${esc(A.name)}</th><th class="num">${esc(B.name)}</th><th class="num">Change</th><th class="num">%</th></tr></thead><tbody>${cats.length?cats.map(k=>row(esc(k),sa.ec[k]||0,sb.ec[k]||0,true)).join(''):'<tr><td colspan="5" class="empty">No expenses in either cycle.</td></tr>'}</tbody></table></div>
    <h3 style="margin-top:18px">Income, spending &amp; savings trend</h3>
    <div class="trend" role="img" aria-label="Trend across cycles">${trend.map(x=>`<div class="tc"><div class="tb"><i class="ti" title="Income ${money(x.s.I)}" style="height:${x.s.I/tm*100}%"></i><i class="te" title="Expenses ${money(x.s.E)}" style="height:${x.s.E/tm*100}%"></i></div><b class="${x.s.net<0?'neg':'pos'}">${money(x.s.net)}</b><small>${esc(x.c.name)}</small></div>`).join('')}</div>
    <p class="muted" style="margin-top:6px"><span class="lg i"></span> Income <span class="lg e"></span> Expenses · figure under each pair = savings (income − expenses)</p>`;
}
async function cycleAction(b){
  const act=b.dataset.act,id=b.dataset.id;
  if(act==='cy-open'){CY.sel=id;renderCycles();$('cyDetail').scrollIntoView({behavior:'smooth',block:'start'});}
  else if(act==='cy-open-tab'){CY.sel=id;showTab('cycles');renderCycles();}
  else if(act==='cy-new'){resetCy();$('cyStart').value=todayStr();cyPreview();$('cyForm').scrollIntoView({behavior:'smooth',block:'center'});$('cyName').focus();}
  else if(act==='cy-uncovered'){resetCy();$('cyStart').value=b.dataset.date;cyPreview();$('cyForm').scrollIntoView({behavior:'smooth',block:'center'});$('cyName').focus();}
  else if(act==='cy-edit'){
    const c=S.cycles.find(x=>x.id===id);if(!c)return;
    $('cyId').value=c.id;$('cyName').value=c.name;$('cyStart').value=c.start;$('cyDesc').value=c.desc;
    $('cyTitle').textContent='✏️ Edit cycle';$('cySubmit').textContent='Update cycle';$('cyCancel').hidden=false;cyPreview();
    $('cyForm').scrollIntoView({behavior:'smooth',block:'center'});
  }else if(act==='cy-del'){
    const c=S.cycles.find(x=>x.id===id);if(!c)return;
    if(await ask('Delete the cycle “'+c.name+'”? Your income and expense records are NOT deleted. Its dates will simply join the previous cycle (or show as “No cycle” if this is your first one).','Delete cycle','Delete cycle')){
      S.cycles=S.cycles.filter(x=>x.id!==id);if($('cyId').value===id)resetCy();commit();toast('Cycle deleted — transactions kept');
    }
  }else if(act==='cy-report'){
    showTab('reports');$('rSystem').value='cycle';rApplySystem();$('rCycle').value=id;rApplyCycle();
  }
}

const TABS=[['dashboard','📊','Dashboard'],['cycles','🔄','Cycles'],['income','💰','Income'],['expense','🧾','Expense'],['lb','🤝','Lend/Borrow'],['charts','📈','Charts'],['reports','📄','Reports'],['backup','💾','Save & Backup'],['nbp','🏦','NBP']];

function showTab(id){
  current=id;
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+id));
  document.querySelectorAll('#tabs button').forEach(b=>{const on=b.dataset.tab===id;b.classList.toggle('active',on);if(on){try{const t=$('tabs');if(t.scrollWidth>t.clientWidth)t.scrollTo({left:b.offsetLeft-(t.clientWidth-b.offsetWidth)/2,behavior:'auto'});}catch(e){}}});

/* ---------- 3D charts (pure canvas) ---------- */
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const c=v=>Math.max(0,Math.min(255,Math.round(v*f)));return 'rgb('+c(r)+','+c(g)+','+c(b)+')';}
function setupCanvas(c){
  const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w||!h)return null;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}
  const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx:ctx,w:w,h:h};
}
function cssVar(n){return getComputedStyle(document.body).getPropertyValue(n).trim()}
function hexLum(h){const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f((n>>8)&255)+.0722*f(n&255);}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p;}
function emptyMsg(ctx,w,h){ctx.fillStyle=cssVar('--muted');ctx.font='14px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('No data to show yet',w/2,h/2);}

const charts={};
function makeChart(id,kind){
  const canvas=$(id);const c={canvas:canvas,kind:kind,prog:1,hover:-1,raf:0,data:[],hits:[],geom:null,tip:canvas.parentElement.querySelector('.tip')};
  const pos=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  canvas.addEventListener('pointermove',e=>{
    if(c.animating)return;const p=pos(e);let idx=-1,html='';
    if(kind==='bar'){
      for(let i=c.hits.length-1;i>=0;i--){const b=c.hits[i];if(p.x>=b.x1&&p.x<=b.x2&&p.y>=b.y1&&p.y<=b.y2){idx=b.id;const m=c.data[b.i];html=`<b>${esc(m.label)}</b><br>${b.k==='inc'?'Income':'Expense'}: ${money(b.k==='inc'?m.inc:m.exp)}<br><span style="opacity:.75">Net: ${money(m.inc-m.exp)}</span>`;break;}}
    }else{
      idx=pieHit(c,p.x,p.y);
      if(idx>=0){const d=c.data[idx],t=c.data.reduce((a,b)=>a+b.value,0);html=`<b>${esc(d.name)}</b><br>${money(d.value)} · ${(d.value/t*100).toFixed(1)}%`;}
    }
    if(idx!==c.hover){c.hover=idx;c.draw();}
    if(c.tip){if(idx>=0){c.tip.innerHTML=html;c.tip.style.display='block';const tw=c.tip.offsetWidth;c.tip.style.left=Math.min(p.x+14,canvas.clientWidth-tw-4)+'px';c.tip.style.top=(p.y+14)+'px';}else c.tip.style.display='none';}
  });
  canvas.addEventListener('pointerleave',()=>{if(c.hover!==-1){c.hover=-1;c.draw();}if(c.tip)c.tip.style.display='none';});
  c.draw=()=>kind==='bar'?drawBars(c):drawPie(c);
  charts[id]=c;return c;
}
function runAnim(c){
  cancelAnimationFrame(c.raf);const t0=performance.now();c.animating=true;
  const step=t=>{const p=Math.min(1,(t-t0)/850);c.prog=1-Math.pow(1-p,3);c.draw();if(p<1)c.raf=requestAnimationFrame(step);else c.animating=false;};
  c.raf=requestAnimationFrame(step);
}

function drawBars(c){
  const s=setupCanvas(c.canvas);if(!s)return;const ctx=s.ctx,w=s.w,h=s.h;ctx.clearRect(0,0,w,h);c.hits=[];
  const data=c.data,n=data.length,p=c.prog,muted=cssVar('--muted'),line=cssVar('--line');
  const mx=Math.max(1,...data.map(m=>Math.max(m.inc,m.exp)));
  if(!data.some(m=>m.inc||m.exp)){emptyMsg(ctx,w,h);return;}
  const max=niceMax(mx),pl=58,pr=18,pt=26,pb=40,D=14,DY=-9;
  const W=w-pl-pr-D,yb=h-pb,Hh=yb-pt+DY;
  // walls & floor
  ctx.fillStyle='rgba(99,102,241,.06)';ctx.beginPath();ctx.moveTo(pl+D,pt);ctx.lineTo(pl+D+W,pt);ctx.lineTo(pl+D+W,yb+DY);ctx.lineTo(pl+D,yb+DY);ctx.fill();
  ctx.fillStyle='rgba(99,102,241,.10)';ctx.beginPath();ctx.moveTo(pl,yb);ctx.lineTo(pl+D,yb+DY);ctx.lineTo(pl+D,pt);ctx.lineTo(pl,pt-DY);ctx.fill();
  ctx.fillStyle='rgba(99,102,241,.16)';ctx.beginPath();ctx.moveTo(pl,yb);ctx.lineTo(pl+W,yb);ctx.lineTo(pl+W+D,yb+DY);ctx.lineTo(pl+D,yb+DY);ctx.fill();
  ctx.font='11.5px system-ui,sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
  for(let t=0;t<=5;t++){
    const v=max*t/5,yf=yb-v/max*Hh;
    ctx.strokeStyle=line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pl,yf);ctx.lineTo(pl+D,yf+DY);ctx.lineTo(pl+D+W,yf+DY);ctx.stroke();
    ctx.fillStyle=muted;ctx.fillText(fmtC(v),pl-8,yf);
  }
  const gw=W/n,bw=Math.min(36,gw*0.3);
  ctx.textBaseline='alphabetic';
  data.forEach((m,i)=>{
    const gx=pl+gw*(i+.5);
    [['inc',gx-bw-3,'#10b981'],['exp',gx+3,'#ef4444']].forEach(([k,x,col])=>{
      const v=m[k],hh=v/max*Hh*p,y=yb-hh,hov=c.hover===i*2+(k==='inc'?0:1);
      const base=hov?shade(col,1.15):col;
      if(hh>0.5){
        const g=ctx.createLinearGradient(0,y,0,yb);g.addColorStop(0,shade(base.charAt(0)==='#'?base:col,1.0));g.addColorStop(1,shade(col,hov?0.9:0.78));
        ctx.fillStyle=g;ctx.fillRect(x,y,bw,hh);
        ctx.fillStyle=shade(col,hov?1.4:1.3);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+bw,y);ctx.lineTo(x+bw+D,y+DY);ctx.lineTo(x+D,y+DY);ctx.closePath();ctx.fill();
        ctx.fillStyle=shade(col,0.6);ctx.beginPath();ctx.moveTo(x+bw,y);ctx.lineTo(x+bw+D,y+DY);ctx.lineTo(x+bw+D,yb+DY);ctx.lineTo(x+bw,yb);ctx.closePath();ctx.fill();
        if(p>=1&&bw>=20){ctx.fillStyle=cssVar('--text');ctx.font='600 11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(fmtC(v),x+bw/2+D/2,y+DY-6);}
      }
      c.hits.push({x1:x,x2:x+bw+D,y1:Math.min(y+DY,yb-6),y2:yb,i:i,k:k,id:i*2+(k==='inc'?0:1)});
    });
    ctx.fillStyle=muted;ctx.font='12px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(n>6?m.short:m.label,gx+D/2,yb+20);
  });
}

function drawPie(c){
  const s=setupCanvas(c.canvas);if(!s)return;const ctx=s.ctx,w=s.w,h=s.h;ctx.clearRect(0,0,w,h);
  const data=c.data,total=data.reduce((a,b)=>a+b.value,0);
  if(!total){emptyMsg(ctx,w,h);c.geom=null;return;}
  const TILT=0.55,depth=Math.min(30,h*0.1),rx=Math.min(w*0.40,(h-depth-44)/(2*TILT)),ry=rx*TILT,cx=w/2,cy=(h-depth)/2,start=-Math.PI/2,sweep=Math.PI*2*c.prog;
  let acc=0;const sl=data.map((d,i)=>{const a0=start+acc/total*sweep;acc+=d.value;const a1=start+acc/total*sweep;return{a0:a0,a1:a1,mid:(a0+a1)/2,color:PALETTE[i%PALETTE.length],i:i,pct:d.value/total};});
  const off=q=>c.hover===q.i?{x:Math.cos(q.mid)*12,y:Math.sin(q.mid)*12*TILT}:{x:0,y:0};
  // shadow
  ctx.save();ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=26;ctx.shadowOffsetY=10;ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(cx,cy+depth,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.restore();
  // side walls
  sl.forEach(q=>{
    const o=off(q);
    for(let a=q.a0;a<q.a1;a+=0.04){
      const b=Math.min(a+0.04,q.a1),m=(a+b)/2;if(Math.sin(m)<=0)continue;
      const x1=cx+o.x+rx*Math.cos(a),y1=cy+o.y+ry*Math.sin(a),x2=cx+o.x+rx*Math.cos(b),y2=cy+o.y+ry*Math.sin(b);
      const col=shade(q.color,0.62+0.16*Math.cos(m));
      ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=.7;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x2,y2+depth);ctx.lineTo(x1,y1+depth);ctx.closePath();ctx.fill();ctx.stroke();
    }
  });
  // tops (hovered last)
  const order=sl.filter(q=>q.i!==c.hover).concat(sl.filter(q=>q.i===c.hover));
  order.forEach(q=>{
    const o=off(q),px=cx+o.x,py=cy+o.y;
    const g=ctx.createRadialGradient(px-rx*.25,py-ry*.4,rx*.08,px,py,rx);g.addColorStop(0,shade(q.color,1.3));g.addColorStop(1,shade(q.color,0.95));
    ctx.fillStyle=g;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(px,py);ctx.ellipse(px,py,rx,ry,0,q.a0,q.a1);ctx.closePath();ctx.fill();ctx.stroke();
    if(c.prog>=1&&q.pct>0.06){const dk=hexLum(q.color)>0.4;ctx.fillStyle=dk?'#000':'#fff';ctx.font='700 12.5px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=dk?'transparent':'rgba(0,0,0,.55)';ctx.shadowBlur=dk?0:4;ctx.fillText(Math.round(q.pct*100)+'%',px+rx*0.64*Math.cos(q.mid),py+ry*0.64*Math.sin(q.mid));ctx.shadowBlur=0;}
  });
  c.geom={cx:cx,cy:cy,rx:rx,ry:ry,start:start,total:total};
}
function pieHit(c,x,y){
  const g=c.geom;if(!g)return -1;const u=(x-g.cx)/g.rx,v=(y-g.cy)/g.ry;if(u*u+v*v>1)return -1;
  let rel=(Math.atan2(v,u)-g.start)%(Math.PI*2);if(rel<0)rel+=Math.PI*2;
  let acc=0;for(let i=0;i<c.data.length;i++){acc+=c.data[i].value/g.total*Math.PI*2;if(rel<acc)return i;}return -1;
}

  $('tab-charts').innerHTML=`
  <div class="card chart-card" style="margin-bottom:18px">

function barData(){
  const n=+$('barRange').value,now=new Date(),out=[];
  for(let k=n-1;k>=0;k--){
    const d=new Date(now.getFullYear(),now.getMonth()-k,1),ym=d.getFullYear()+'-'+pad(d.getMonth()+1);
    out.push({label:MON[d.getMonth()]+' '+d.getFullYear(),short:MON[d.getMonth()],inc:sum(S.income.filter(x=>x.date.startsWith(ym))),exp:sum(S.expense.filter(x=>x.date.startsWith(ym)))});
  }
  return out;
}
function pieData(k){
  const per=$('pieRange').value,t=todayStr(),ym=t.slice(0,7),y=t.slice(0,4),m={};
  S[k].filter(x=>per==='all'||(per==='month'&&x.date.startsWith(ym))||(per==='year'&&x.date.startsWith(y))).forEach(x=>m[x.cat]=(m[x.cat]||0)+x.amount);
  let arr=Object.entries(m).map(e=>({name:e[0],value:e[1]})).sort((a,b)=>b.value-a.value);
  if(arr.length>8){const rest=arr.slice(7);arr=arr.slice(0,7);arr.push({name:'Others',value:rest.reduce((s,x)=>s+x.value,0)});}
  return arr;
}
function legendHTML(d){const t=d.reduce((a,b)=>a+b.value,0);return d.length?d.map((x,i)=>`<li><i class="dot" style="background:${PALETTE[i%PALETTE.length]}"></i><span class="ln">${esc(x.name)}</span><b>${money(x.value)}</b><em>${(x.value/t*100).toFixed(1)}%</em></li>`).join(''):'<li class="muted">No data for this period</li>';}
function renderCharts(animate){
  if(current!=='charts')return;
  const bar=charts.cBar,ex=charts.cExp,inc=charts.cInc;
  bar.data=barData();ex.data=pieData('expense');inc.data=pieData('income');
  const lbl={month:'this month',year:'this year',all:'all time'}[$('pieRange').value];
  $('expTitle').textContent='Expenses by category · '+lbl+' · '+money(ex.data.reduce((a,b)=>a+b.value,0));
  $('incTitle').textContent='Income by category · '+lbl+' · '+money(inc.data.reduce((a,b)=>a+b.value,0));
  $('expLegend').innerHTML=legendHTML(ex.data);$('incLegend').innerHTML=legendHTML(inc.data);
  [bar,ex,inc].forEach(c=>{cancelAnimationFrame(c.raf);c.animating=false;c.hover=-1;if(animate){c.prog=0;runAnim(c);}else{c.prog=1;c.draw();}});
}

function rFillCycles(){

function reportRows(){
  const from=$('rFrom').value,to=$('rTo').value,type=$('rType').value,cat=$('rCat').value,q=$('rSearch').value.trim().toLowerCase();

  S.income.forEach(x=>rows.push({date:x.date,type:'Income',who:x.cat,detail:x.note,amount:x.amount,cat:true,cycle:cyN(x.date)}));
  S.expense.forEach(x=>rows.push({date:x.date,type:'Expense',who:x.cat,detail:x.note,amount:x.amount,cat:true,cycle:cyN(x.date)}));
  S.lend.forEach(x=>rows.push({date:x.date,type:'Lend',who:x.person,detail:(x.note?x.note+' ':'')+(x.settled?'[Settled]':'[Pending]'),amount:x.amount}));
  S.borrow.forEach(x=>rows.push({date:x.date,type:'Borrow',who:x.person,detail:(x.note?x.note+' ':'')+(x.settled?'[Settled]':'[Pending]'),amount:x.amount}));
  rows=rows.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to)&&(type==='all'||r.type===type)&&(!cat||(r.cat&&r.who===cat))&&(!q||(r.who+' '+r.detail).toLowerCase().includes(q)));
  return rows.sort(byDateDesc);
}

  const ex={},inn={};rows.forEach(r=>{if(r.type==='Expense')ex[r.who]=r2((ex[r.who]||0)+r.amount);else if(r.type==='Income')inn[r.who]=r2((inn[r.who]||0)+r.amount);});

/* ---------- NBP ---------- */
const r2=n=>Math.round((+n||0)*100)/100;
function plCalc(x){const tax=x.kind==='profit'?r2(x.amount*x.rate/100):0;return{tax:tax,net:x.kind==='profit'?r2(x.amount-tax):-r2(x.amount)};}
function nbpTotals(){
  const added=r2(sum(S.nbp.filter(x=>x.type==='add'))),sub=r2(sum(S.nbp.filter(x=>x.type==='sub')));
  let gross=0,loss=0,tax=0;
  S.nbpPL.forEach(x=>{if(x.kind==='profit'){gross+=x.amount;tax+=plCalc(x).tax;}else loss+=x.amount;});
  gross=r2(gross);loss=r2(loss);tax=r2(tax);
  const bal=r2(added-sub),net=r2(gross-tax-loss);
  return{added:added,sub:sub,bal:bal,gross:gross,loss:loss,tax:tax,net:net,grand:r2(bal+net)};
}

}

  const sgn=v=>`<b class="${v<0?'neg':'pos'}">${money(r2(v))}</b>`;
  $('plMonths').innerHTML=keys.length?keys.map(k=>{const o=mm[k],p=k.split('-');return `<tr><td><b>${MON[+p[1]-1]||k} ${p[0]}</b></td><td class="num">${money(r2(o.profit))}</td><td class="num">${money(r2(o.loss))}</td><td class="num">${money(r2(o.tax))}</td><td class="num">${sgn(o.net)}</td></tr>`}).join('')+`<tr class="sub-total"><td>Total</td><td class="num">${money(T.gross)}</td><td class="num">${money(T.loss)}</td><td class="num">${money(T.tax)}</td><td class="num">${sgn(T.net)}</td></tr>`:'<tr><td colspan="5" class="empty">No profit or loss entered yet.</td></tr>';
  $('plBody').innerHTML=arr.length?arr.map(x=>{const c=plCalc(x);return `<tr><td>${fmtDate(x.date)}</td><td><span class="tag ${x.kind==='profit'?'Income':'Expense'}">${x.kind==='profit'?'Profit':'Loss'}</span></td><td class="num">${money(x.amount)}</td><td class="num">${x.kind==='profit'?x.rate+'%':'—'}</td><td class="num">${money(c.tax)}</td><td class="num">${sgn(c.net)}</td><td>${esc(x.note)}</td><td class="act"><button class="btn sm" data-act="pl-edit" data-id="${x.id}">Edit</button> <button class="btn sm danger" data-act="pl-del" data-id="${x.id}">Delete</button></td></tr>`}).join(''):'<tr><td colspan="8" class="empty">No entries yet.</td></tr>';
  const rf=$('plRate');if(document.activeElement!==rf&&!$('plId').value)rf.value=S.settings.taxRate;
  plPreview();
}
async function nbpAction(b){
  const act=b.dataset.act,id=b.dataset.id;
  if(act==='nbp-edit'){
    const x=S.nbp.find(v=>v.id===id);if(!x)return;
    $('nbpId').value=x.id;$('nbpDate').value=x.date;$('nbpAmt').value=x.amount;$('nbpNote').value=x.note||'';setSelect($('nbpCat'),x.cat);setNbpType(x.type);
    $('nbpForm').scrollIntoView({behavior:'smooth',block:'center'});
  }else if(act==='nbp-del'){
    if(await ask('Delete this NBP entry? This cannot be undone.','Delete')){S.nbp=S.nbp.filter(v=>v.id!==id);if($('nbpId').value===id)resetNbp();commit();toast('Entry deleted');}
  }else if(act==='nbp-delcat'){
    const name=b.dataset.name,inUse=S.nbp.filter(v=>v.cat===name).length;
    if(await ask(`Delete category “${name}”?`+(inUse?` ${inUse} existing entr${inUse>1?'ies':'y'} will keep this category name.`:''),'Delete')){S.nbpCats=S.nbpCats.filter(c=>c!==name);commit();toast('Category deleted');}
  }else if(act==='pl-edit'){
    const x=S.nbpPL.find(v=>v.id===id);if(!x)return;
    $('plId').value=x.id;$('plDate').value=x.date;$('plAmt').value=x.amount;$('plRate').value=x.rate;$('plNote').value=x.note||'';setPlKind(x.kind);
    $('plForm').scrollIntoView({behavior:'smooth',block:'center'});
  }else if(act==='pl-del'){
    if(await ask('Delete this profit / loss entry? This cannot be undone.','Delete')){S.nbpPL=S.nbpPL.filter(v=>v.id!==id);if($('plId').value===id)resetPL();commit();toast('Entry deleted');}
  }
}

/* ---------- backup ---------- */
function buildBackup(){
  $('tab-backup').innerHTML=`
  <div class="card" style="margin-bottom:18px"><h2>📁 Autosave folder</h2>
    <p class="muted">Select a folder once. After that, every change you make is saved into it automatically as <b>PocketLedger-autosave.json</b> — no download prompts.</p>
    <div id="fsBody"></div>
  </div>
  <div class="card" id="phoneCard" style="margin-bottom:18px"><h2>📱 Phone safety</h2>
    <p class="muted">Android browsers cannot write silently into a folder, so PocketLedger protects your data in three ways instead.</p>
    <div id="phoneBody"></div>
  </div>
  <div class="grid even">
    <div class="card"><h2>💾 Save</h2><p class="muted">Your data is stored privately in this browser. No server, no account.</p>
      <label class="switch" style="margin:14px 0"><input type="checkbox" id="bkAuto"> Autosave — save automatically after every change</label>
      <div class="note">Status: <b id="bkStatus"></b></div><br>
      <div class="actions"><button class="btn green" id="bkSave">Save now</button></div>
      <div class="info-grid" id="bkInfo"></div>
    </div>
    <div class="card"><h2>📦 Backup file</h2><p class="muted">Download a backup file you can keep safe, or restore from one. Do this regularly — clearing your browser data erases the in-browser copy.</p>
      <div class="actions" style="margin:14px 0"><button class="btn primary" id="bkShare">📤 Share backup (Drive, WhatsApp, email…)</button><button class="btn" id="bkExport">⬇ Download backup (.json)</button><button class="btn" id="bkImportBtn">⬆ Restore from backup</button></div>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
      <hr><h3>Other</h3>
      <div class="actions"><button class="btn" id="bkSample">Load sample data</button><button class="btn danger" id="bkErase">Erase all data</button></div>
    </div>
  </div>`;
  if(IS_MOBILE){const pc=$('phoneCard'),first=$('tab-backup').firstElementChild;if(pc&&first&&pc!==first)first.before(pc);}
  $('fsBody').addEventListener('click',async e=>{
    const a=e.target.closest('[data-fs]');if(!a)return;const act=a.dataset.fs;
    if(act==='choose')await connect('dir');
    else if(act==='file')await connect('file');
    else if(act==='save')await saveNow();
    else if(act==='reconnect')await reconnectFolder();
    else if(act==='off')await disconnectFolder();
  });
  $('fsBody').addEventListener('change',e=>{
    if(e.target.id==='fsDated'){S.settings.keepDated=e.target.checked;if(S.settings.autosave)save();else{dirty=true;updateStatus();}writeFolder();}
    if(e.target.id==='fsDl'){S.settings.autoDownload=e.target.checked;if(S.settings.autosave)save();else{dirty=true;updateStatus();}if(e.target.checked){doAutoDownload();toast('Backup downloaded — more will follow after changes');}else{clearTimeout(dlTimer);renderFolder();}}
  });
  $('bkAuto').addEventListener('change',e=>{S.settings.autosave=e.target.checked;if(S.settings.autosave)save();else updateStatus();toast(S.settings.autosave?'Autosave enabled':'Autosave disabled — use “Save now”');});
  $('bkSave').addEventListener('click',()=>{save();toast(saveErr?'Could not save':'Data saved');});
  $('bkExport').addEventListener('click',()=>{download('pocketledger-backup-'+todayStr()+'.json',JSON.stringify(S,null,2));markBackup();toast('Backup downloaded');});
  $('bkShare').addEventListener('click',shareBackup);
  $('phoneBody').addEventListener('click',async e=>{
    const a=e.target.closest('[data-ph]');if(!a)return;const k=a.dataset.ph;
    if(k==='install'&&deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice;}catch(x){}deferredInstall=null;renderPhone();}
    else if(k==='persist'){try{const ok=await navigator.storage.persist();toast(ok?'✔ Storage protected':'Your browser did not grant protection');}catch(x){toast('Not supported here');}renderPhone();}
    else if(k==='snap'){await takeSnapshot(true);toast('✔ Snapshot saved');renderPhone();}
    else if(k==='restore'){const id=+a.dataset.id;const sn=await snapGet(id);if(sn&&await ask('Replace all current data with the snapshot from '+new Date(sn.ts).toLocaleString()+'?','Restore','Restore snapshot')){try{S=normalize(JSON.parse(sn.json));commit();toast('Snapshot restored');}catch(x){toast('That snapshot is damaged');}}}
    else if(k==='delsnap'){await snapDel(+a.dataset.id);renderPhone();}
  });
  $('bkImportBtn').addEventListener('click',()=>$('bkFile').click());
  $('bkFile').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=async()=>{
      try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||!['income','expense','lend','borrow','nbp','nbpPL'].some(k=>k in o))throw 0;
        if(await ask('This replaces all current data with the backup file. Continue?','Restore','Restore backup')){S=normalize(o);commit();toast('Backup restored');}
      }catch(err){toast('That file is not a valid backup');}
      $('bkFile').value='';
    };r.readAsText(f);
  });
  $('bkSample').addEventListener('click',async()=>{if(S.income.length+S.expense.length+S.lend.length+S.borrow.length+S.nbp.length+S.nbpPL.length&&!await ask('This replaces your current entries with sample data. Continue?','Load sample','Load sample data'))return;loadSample();});
  $('bkErase').addEventListener('click',async()=>{if(await ask('This permanently deletes ALL entries and categories. Download a backup first if unsure.','Erase everything','Erase all data')){const s=S.settings;S=defaults();S.settings=s;commit();toast('All data erased');}});
}
function renderFolder(){
  const el=$('fsBody');if(!el)return;
  const block=fsBlock(),on=!!FS.h,nm=on?esc(FS.h.name):'',kind=FS.mode==='file'?'Backup file':'Folder';
  let h='';
  if(FS.picking)h+=`<div class="fsb warn"><span class="tag warnt">⏳ Waiting</span> <b class="big">Choose a folder in the window that opened…</b><br>After you press <b>Select Folder</b> in that window, Chrome may ask <b>“Edit files”</b> — click it.${FS.pickNote?'<br><b>'+esc(FS.pickNote)+'</b>':''}</div>`;
  else if(!on)h+=`<div class="fsb none"><span class="tag errt">✖ Not selected</span> <b class="big">No folder selected</b><br>Your data is saved in this browser only. Select a folder to also save a backup file there automatically after every change.</div>`;
  else if(FS.state==='ok')h+=`<div class="fsb ok"><span class="tag ok">✔ Selected</span> <b class="big">${kind}: ${nm}</b><br>Autosave is ON — every change is saved there automatically.<br>File: <b>${FS.mode==='file'?nm:FS_NAME}</b>${FS.last?' · Last saved '+hms(FS.last)+' · '+(FS.size/1024).toFixed(1)+' KB':''}${FS.persist?'':'<br><span class="tag warnt">Not remembered</span> Your browser could not store this selection, so you will need to select it again after reopening.'}</div>`;
  else if(FS.state==='needperm')h+=`<div class="fsb warn"><span class="tag warnt">⚠ Permission needed</span> <b class="big">${kind}: ${nm}</b><br>After reopening, the browser needs your permission again. Click <b>Reconnect</b> (or click anywhere and choose Allow).</div>`;
  else h+=`<div class="fsb err"><span class="tag errt">✖ Problem</span> <b class="big">${kind}: ${nm}</b><br>${esc(FS.msg||'')}${FS.tech?'<br><small class="muted">'+esc(FS.tech)+'</small>':''}</div>`;
  h+=`<div class="actions"><button class="btn primary" data-fs="choose">📁 Select Folder</button><button class="btn green" data-fs="save">💾 Save</button>${on&&FS.state==='needperm'?'<button class="btn" data-fs="reconnect">🔓 Reconnect</button>':''}${on?'<button class="btn" data-fs="off">Disconnect</button>':''}</div>`;
  if(on&&FS.mode==='dir')h+=`<label class="switch" style="margin:14px 0 0"><input type="checkbox" id="fsDated" ${S.settings.keepDated?'checked':''}> Also keep a dated copy for each day (PocketLedger-backup-YYYY-MM-DD.json)</label>`;
  if(block){
    h+=`<div class="note" style="margin-top:14px"><span class="tag errt">Not available here</span> ${esc(fsWhy(block))}<br><b>${esc(FS_FIX[block])}</b></div>`;
  }else{
    h+=`<p class="muted" style="margin:12px 0 0;font-size:13px"><b>Tip:</b> Chrome refuses Desktop, Documents, Downloads and drive roots (C:, D:) themselves. Create a <b>new folder</b> first (for example Documents ▸ PocketLedger Backups), then select it.</p>`;
    if(HAS_FILE())h+=`<div class="actions" style="margin-top:10px"><button class="btn sm" data-fs="file">📄 Can’t select your folder? Select a backup file instead</button></div>`;
  }
  if(FS.err&&!block&&!FS.picking)h+=`<div class="note" style="margin-top:12px"><span class="tag errt">Not selected</span> ${esc(FS.err)}${FS.tech?'<br><small class="muted">'+esc(FS.tech)+'</small>':''}${HAS_FILE()&&FS.mode!=='file'&&!on?'<div class="actions" style="margin-top:10px"><button class="btn primary" data-fs="file">📄 Use a backup file instead (works when folders are blocked)</button></div>':''}</div>`;
  h+=`<p class="muted" style="margin:12px 0 0;font-size:12.5px">${esc(browserName())} · Folder access: ${HAS_DIR()?'✔ supported':'✖ not supported'} · Backup-file access: ${HAS_FILE()?'✔ supported':'✖ not supported'}</p>`;
  if(!on){
    h+=`<hr><label class="switch"><input type="checkbox" id="fsDl" ${S.settings.autoDownload?'checked':''}> Fallback: auto-download a backup file after changes</label>
    <p class="muted" style="margin:8px 0 0;font-size:13px">Saves <b>${FS_NAME}</b> to your browser’s Downloads folder about 15 seconds after you stop making changes (works in any browser). If the browser asks to allow multiple downloads, click Allow.${FS.lastDl?'<br>Last download: '+hms(FS.lastDl):''}</p>`;
  }
  el.innerHTML=h;
}
function renderBackup(){
  if(!$('bkAuto'))return;renderFolder();renderPhone();
  $('bkAuto').checked=!!S.settings.autosave;
  $('bkInfo').innerHTML=[['Income',S.income.length],['Expenses',S.expense.length],['Lend',S.lend.length],['Borrow',S.borrow.length],['NBP money',S.nbp.length],['NBP profit/loss',S.nbpPL.length],['Cycle',S.cycles.length]].map(x=>`<div><b>${x[1]}</b><span>${x[0]} records</span></div>`).join('');
  updateStatus();
}
function loadSample(){
  let seed=7;const r=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const now=new Date();S.income=[];S.expense=[];S.lend=[];S.borrow=[];
  for(let k=5;k>=0;k--){
    const dt=new Date(now.getFullYear(),now.getMonth()-k,1),y=dt.getFullYear(),m=dt.getMonth()+1,maxd=k===0?now.getDate():28;
    const D=d=>y+'-'+pad(m)+'-'+pad(Math.min(d,maxd));
    const inc=(d,c,a,n)=>S.income.push({id:uid(),date:D(d),cat:c,amount:Math.round(a),note:n||''});
    const exp=(d,c,a,n)=>S.expense.push({id:uid(),date:D(d),cat:c,amount:Math.round(a),note:n||''});
    inc(1,'Salary',120000,'Monthly salary');
    if(r()>.35)inc(10,'Dividend',3000+r()*9000,'Stock dividend');
    if(r()>.5)inc(15,'Freelance',10000+r()*25000,'Side project');
    exp(1,'Rent',35000,'House rent');exp(5,'Utilities',7000+r()*5000,'Electricity & gas');exp(8,'Utilities',2500,'Internet');
    for(let w=0;w<4;w++)exp(3+w*7,'Food & Groceries',5000+r()*6000,'Weekly groceries');
    exp(12,'Transport',3000+r()*4000,'Fuel');exp(18,'Entertainment',2000+r()*5000,'Weekend outing');
    exp(20,'Shopping',3000+r()*12000,'Clothes');if(r()>.5)exp(22,'Health',1500+r()*6000,'Doctor');if(r()>.6)exp(25,'Education',5000+r()*7000,'Course fee');
  }
  const d=n=>{const x=new Date(now.getFullYear(),now.getMonth(),now.getDate()-n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
  S.lend.push({id:uid(),date:d(40),person:'Ali',amount:15000,note:'Needed for a deposit',settled:false},{id:uid(),date:d(90),person:'Sara',amount:8000,note:'Returned in full',settled:true});
  S.borrow.push({id:uid(),date:d(20),person:'Bilal',amount:20000,note:'Short-term loan',settled:false});
  S.nbp=[];S.nbpPL=[];
  for(let k=4;k>=0;k--){const dt=new Date(now.getFullYear(),now.getMonth()-k,1),y=dt.getFullYear(),m=dt.getMonth()+1,maxd=k===0?now.getDate():28,D=d=>y+'-'+pad(m)+'-'+pad(Math.min(d,maxd));
    S.nbp.push({id:uid(),date:D(2),type:'add',cat:'Deposit',amount:100000+Math.round(r()*50000),note:'Monthly deposit'});
    S.nbp.push({id:uid(),date:D(9),type:'sub',cat:'Withdrawal',amount:10000+Math.round(r()*15000),note:'Cash withdrawal'});
    S.nbp.push({id:uid(),date:D(14),type:'sub',cat:'Bank charges',amount:300+Math.round(r()*400),note:'Service charges'});
    if(r()>.4)S.nbp.push({id:uid(),date:D(18),type:'sub',cat:'Investment',amount:20000+Math.round(r()*30000),note:'Savings certificate'});
    if(k%2===0)S.nbpPL.push({id:uid(),date:D(28),kind:'profit',amount:6000+Math.round(r()*9000),rate:15,note:'Monthly profit'});
    else S.nbpPL.push({id:uid(),date:D(28),kind:r()>.7?'loss':'profit',amount:2000+Math.round(r()*5000),rate:15,note:'Monthly result'});}
  commit();toast('Sample data loaded');
}

/* ---------- settings ---------- */
function applySettings(){
  document.documentElement.dataset.theme=S.settings.theme;try{document.querySelector('meta[name=theme-color]').content=({light:'#4338ca',dark:'#312e81',contrast:'#ff2d95'})[S.settings.theme]||'#4338ca';}catch(e){}
  $('appNameHead').textContent=S.settings.appName;document.title=S.settings.appName;
}

/* ---------- render all ---------- */
function renderAll(){
  applySettings();renderDashboard();renderTx('income');renderTx('expense');renderLB('lend');renderLB('borrow');
  rFillCycles();renderCycles();fillReportCats();if(current==='reports')renderReport();
  renderBackup();renderNbp();if(current==='charts')renderCharts(false);
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const tb=e.target.closest('#tabs button');if(tb){showTab(tb.dataset.tab);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,k=b.dataset.kind,id=b.dataset.id;
  if(act.startsWith('nbp-')||act.startsWith('pl-')){await nbpAction(b);return;}
  if(act.startsWith('cy-')){await cycleAction(b);return;}
  if(act==='goto'){showTab(b.dataset.tab);return;}
  if(act==='edit'){
    const x=S[k].find(v=>v.id===id);if(!x)return;
    $(k+'Id').value=x.id;$(k+'Date').value=x.date;$(k+'Amt').value=x.amount;$(k+'Note').value=x.note||'';
    if(k==='income'||k==='expense'){setSelect($(k+'Cat'),x.cat);$(k+'Title').textContent='✏️ Edit '+KIND[k].label;}
    else{$(k+'Person').value=x.person;$(k+'Title').textContent='Edit '+LB[k].title.toLowerCase()+' record';}
    $(k+'Submit').textContent='Update';$(k+'Cancel').hidden=false;
    if(k==='income'||k==='expense')txHint(k);
    $(k+'Form').scrollIntoView({behavior:'smooth',block:'center'});return;
  }
  if(act==='del'){
    if(await ask('Delete this entry? This cannot be undone.','Delete')){S[k]=S[k].filter(v=>v.id!==id);if($(k+'Id')&&$(k+'Id').value===id){(k==='income'||k==='expense')?resetTx(k):resetLB(k);}commit();toast('Entry deleted');}return;
  }
  if(act==='delcat'){
    const name=b.dataset.name,inUse=S[k].filter(v=>v.cat===name).length;
    if(await ask(`Delete category “${name}”?`+(inUse?` ${inUse} existing entr${inUse>1?'ies':'y'} will keep this category name.`:''),'Delete')){const key=KIND[k].cats;S[key]=S[key].filter(c=>c!==name);commit();toast('Category deleted');}return;
  }
  if(act==='settle'){const x=S[k].find(v=>v.id===id);if(x){x.settled=!x.settled;commit();}}
});
$('btnTheme').addEventListener('click',()=>{const o=['light','dark','contrast'],n=o[(o.indexOf(S.settings.theme)+1)%3];S.settings.theme=n;commit();toast('Theme: '+({light:'Light',dark:'Dark',contrast:'Neon Contrast'})[n]);});
$('btnSettings').addEventListener('click',()=>{$('setName').value=S.settings.appName;$('setCur').value=S.settings.currency;$('setTheme').value=S.settings.theme;$('settingsDlg').showModal();});
$('setCancel').addEventListener('click',()=>$('settingsDlg').close());
$('setSave').addEventListener('click',()=>{
  S.settings.appName=$('setName').value.trim()||'PocketLedger';S.settings.currency=$('setCur').value.trim();S.settings.theme=$('setTheme').value;
  $('settingsDlg').close();commit();toast('Settings saved');
});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(current==='charts')renderCharts(false)},120)});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){try{takeSnapshot(true);}catch(e){}if(FS.h&&FS.state==='ok'){clearTimeout(fsTimer);writeFolder();}}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==current)showTab(h);});

/* ---------- init ---------- */
load();buildTabs();buildTx('income');buildTx('expense');buildLB();buildCharts();buildReports();buildBackup();buildNbp();buildCycles();
const h0=location.hash.slice(1);showTab(TABS.some(t=>t[0]===h0)?h0:'dashboard');
renderAll();updateStatus();initFolder();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}takeSnapshot(false);bkReminder();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue||dirty)return;try{S=normalize(JSON.parse(e.newValue));renderAll();toast('Updated from another window');}catch(err){}});
$('saveStatus').style.cursor='pointer';$('saveStatus').addEventListener('click',()=>{if(FS.h&&FS.state==='needperm')reconnectFolder();else showTab('backup');});
})();
</script>
